name: repo-discovery-demo

on:
  pull_request:
    paths:
      - 'builds/repo-discovery-demo/**'
      - '.github/workflows/repo-discovery-demo.yml'
  push:
    branches: [main]
    paths:
      - 'builds/repo-discovery-demo/**'
      - '.github/workflows/repo-discovery-demo.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check builds/repo-discovery-demo/app.js
      - name: Static contract
        run: |
          python - <<'PY'
          from pathlib import Path
          root = Path('builds/repo-discovery-demo')
          html = (root/'index.html').read_text(encoding='utf-8')
          js = (root/'app.js').read_text(encoding='utf-8')
          required_ids = ['repoCard','wikiBtn','rateStatus','tokenInput','importInput']
          for item in required_ids:
              assert f'id="{item}"' in html, item
          required_behaviors = ['indexedDB.open','weightedSampleWithoutReplacement','/search/repositories','/repositories/${id}','sessionStorage','TextDecoder']
          for item in required_behaviors:
              assert item in js, item
          print('static contract ok')
          PY
      - name: Serve smoke test
        run: |
          python -m http.server 8080 --directory builds/repo-discovery-demo >/tmp/repo-demo-http.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'Repo Discovery Engine'
          curl --fail --silent http://127.0.0.1:8080/app.js | grep -q 'searchPool'
