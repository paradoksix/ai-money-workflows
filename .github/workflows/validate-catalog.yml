name: Validate catalog

on:
  push:
    paths:
      - "catalog.csv"
      - "data/cases.csv"
      - "docs/**"
      - "encyclopedia/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    paths:
      - "catalog.csv"
      - "data/cases.csv"
      - "docs/**"
      - "encyclopedia/**"
      - "scripts/**"
      - "README.md"
      - ".github/workflows/validate-catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pinned-source core
        run: python scripts/validate_catalog.py

      - name: Validate full case index and cross-checks
        run: python scripts/validate_cases.py

      - name: Assert the docs/ wiki is up to date
        run: |
          python scripts/build_site.py
          if ! git diff --quiet -- docs; then
            echo "::error::The docs/ wiki is stale. Run 'python3 scripts/build_site.py' and commit the result."
            git diff --stat -- docs
            exit 1
          fi
          # A page the builder started emitting but nobody committed is untracked,
          # so it never shows up in git diff.
          if [ -n "$(git status --porcelain -- docs)" ]; then
            echo "::error::The build produced files that are not committed:"
            git status --porcelain -- docs
            exit 1
          fi
          echo "docs/ matches data/cases.csv and the encyclopedia"
