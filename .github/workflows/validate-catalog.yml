name: Validate catalog

on:
  push:
    paths:
      - "catalog.csv"
      - "data/cases.csv"
      - "docs/index.html"
      - "encyclopedia/**"
      - "scripts/**"
      - ".github/workflows/validate-catalog.yml"
  pull_request:
    paths:
      - "catalog.csv"
      - "data/cases.csv"
      - "docs/index.html"
      - "encyclopedia/**"
      - "scripts/**"
      - ".github/workflows/validate-catalog.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate pinned-source core
        run: python scripts/validate_catalog.py

      - name: Validate full case index and cross-checks
        run: python scripts/validate_cases.py

      - name: Assert docs/index.html is up to date
        run: |
          python scripts/build_site.py
          if ! git diff --quiet -- docs/index.html; then
            echo "::error::docs/index.html is stale. Run 'python3 scripts/build_site.py' and commit the result."
            git diff --stat -- docs/index.html
            exit 1
          fi
          echo "docs/index.html matches data/cases.csv"
