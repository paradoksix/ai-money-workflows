name: archive-first-discovery

on:
  pull_request:
    paths:
      - 'builds/repo-discovery-demo/archive-app.js'
      - 'builds/repo-discovery-demo/index.html'
      - 'docs/repo-discovery/**'
      - '.github/workflows/archive-discovery.yml'
  push:
    branches: [main]
    paths:
      - 'builds/repo-discovery-demo/archive-app.js'
      - 'builds/repo-discovery-demo/index.html'
      - 'docs/repo-discovery/**'
      - '.github/workflows/archive-discovery.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: node --check builds/repo-discovery-demo/archive-app.js
      - name: Archive-first contracts
        run: |
          grep -q "data/cases.csv" builds/repo-discovery-demo/archive-app.js
          grep -q "async function frontier" builds/repo-discovery-demo/archive-app.js
          grep -q "archiveRepos" builds/repo-discovery-demo/archive-app.js
          grep -q "archive-app.js" docs/repo-discovery/index.html
      - name: Serve live-copy smoke
        run: |
          python -m http.server 8080 --directory docs/repo-discovery >/tmp/archive-discovery.log 2>&1 &
          pid=$!
          trap 'kill $pid' EXIT
          sleep 1
          curl --fail --silent http://127.0.0.1:8080/ | grep -q 'Repo Discovery Engine'
          curl --fail --silent http://127.0.0.1:8080/archive-app.js | grep -q 'AI Money Workflows arşivi'
