<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>AI Money Workflows — Repo Discovery Demo</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">AI Money Workflows</p>
        <h1>Repo Discovery Engine — ücretsiz demo</h1>
      </div>
      <div class="status-row">
        <span id="networkStatus" class="pill">hazırlanıyor</span>
        <span id="rateStatus" class="pill">rate-limit: ?</span>
      </div>
    </header>

    <section class="toolbar" aria-label="Keşif ayarları">
      <label>
        Tema
        <select id="modeSelect">
          <option value="money-ai">AI + gelir/otomasyon</option>
          <option value="automation">Otomasyon</option>
          <option value="agents">AI agent</option>
          <option value="local-ai">Yerel AI</option>
          <option value="scraping">Araştırma / scraping</option>
        </select>
      </label>
      <label>
        Minimum yıldız
        <input id="minStars" type="number" min="0" max="100000" value="20" />
      </label>
      <label class="grow">
        İsteğe bağlı GitHub token
        <input id="tokenInput" type="password" autocomplete="off" placeholder="yalnızca bu sekmede tutulur" />
      </label>
      <button id="applyBtn" class="secondary" type="button">Havuzu yenile</button>
      <button id="exportBtn" class="ghost" type="button">Seen dışa aktar</button>
      <label class="ghost file-label">Seen içe aktar<input id="importInput" type="file" accept="application/json" hidden /></label>
    </section>

    <section class="stage" aria-live="polite">
      <button id="repoCard" class="repo-card" type="button" aria-describedby="spaceHint">
        <span class="skeleton">İlk repo hazırlanıyor…</span>
      </button>
      <p id="spaceHint" class="hint">Kart odaktayken <kbd>Space</kbd> / <kbd>Enter</kbd> → sıradaki hiç görülmemiş repo</p>
    </section>

    <section class="actions" aria-label="Repo işlemleri">
      <a id="githubLink" class="primary disabled" href="#" target="_blank" rel="noreferrer">GitHub</a>
      <button id="wikiBtn" class="secondary" type="button" disabled>Ücretsiz wiki özeti</button>
      <a id="deepWikiLink" class="ghost disabled" href="#" target="_blank" rel="noreferrer">DeepWiki</a>
      <button id="skipSeenBtn" class="ghost" type="button">Görülmüşleri gerektiğinde aç</button>
    </section>

    <section id="wikiPanel" class="wiki-panel" hidden>
      <div class="wiki-head">
        <div>
          <p class="eyebrow">Talep üzerine</p>
          <h2 id="wikiTitle">Repo özeti</h2>
        </div>
        <button id="closeWikiBtn" class="ghost" type="button">Kapat</button>
      </div>
      <div id="wikiBody" class="wiki-body"></div>
    </section>

    <details class="diagnostics">
      <summary>Tanılama</summary>
      <pre id="diag"></pre>
    </details>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
